version: 2
updates:
  # The workflows hold `id-token: write`, so a compromised action tag is a supply-chain risk.
  # Actions are pinned to commit SHAs; Dependabot is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # `bun`, not `npm`: the npm ecosystem updates package.json but leaves bun.lock untouched,
  # which fails `bun install --frozen-lockfile` in CI.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
