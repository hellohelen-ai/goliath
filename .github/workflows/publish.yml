name: publish

# SDK publishing requires a protected v* tag. Manual runs only recover the starter
# for an existing tag whose SDK is already published from that exact commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose starter needs publishing (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Gated on the `release` environment: a required reviewer has to approve the run before
    # any step executes. Repo write access is npm publish access under trusted publishing,
    # so this is the approval that actually stands between a tag and the registry.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog and release notes need history
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: the npm CLI picks up the OIDC token itself, and publishes a
      # provenance attestation alongside the tarball.
      # `prepublishOnly` runs `bun run check`, which builds dist/ before packing.
      - run: npm publish

      - name: Read the published version back from the registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 120); do
            got="$(npm view "@hellohelen-ai/goliath@$version" version 2>/dev/null || true)"
            if [ "$got" = "$version" ]; then
              echo "registry serves $version"
              npm view "@hellohelen-ai/goliath@$version" dist.attestations
              exit 0
            fi
            sleep 10
          done
          echo "Published, but the registry did not serve $version within twenty minutes." >&2
          exit 1

      - name: Extract this version's changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found && /^\[[^]]+\]:/   { exit }
            found                     { print }
          ' CHANGELOG.md > "$notes"
          if [ -s "$notes" ]; then
            echo "NOTES=$notes" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG entry for $version; falling back to generated notes." >&2
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${NOTES:-}" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  # The template pins this release's SDK, so publish it only after the SDK is available.
  # Configure this package's own npm trusted publisher before the next release.
  publish-starter:
    needs: publish
    concurrency:
      group: starter-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    if: >-
      ${{ !cancelled() && (needs.publish.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve an existing release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag, not a branch or commit." >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Require the matching published SDK
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          published_commit="$(npm view "@hellohelen-ai/goliath@$version" gitHead)"
          if [ "$published_commit" != "$(git rev-parse HEAD)" ]; then
            echo "The SDK must already be published from this exact release commit." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run starter:pack "$RUNNER_TEMP/starter"
      - name: Publish the starter unless identical bytes are already available
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          published="$(npm view "@hellohelen-ai/expo-template-goliath@$version" dist.shasum 2>/dev/null || true)"
          if [ -n "$published" ]; then
            packed="$(sha1sum "$RUNNER_TEMP/starter/"*.tgz | cut -d ' ' -f 1)"
            test "$published" = "$packed" || { echo "Published starter bytes differ." >&2; exit 1; }
            echo "The identical starter is already published."
          else
            npm publish "$RUNNER_TEMP/starter/"*.tgz --access public
          fi
      - name: Verify the published template
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for i in $(seq 1 120); do
            got="$(npm view "@hellohelen-ai/expo-template-goliath@$version" version 2>/dev/null || true)"
            if [ "$got" = "$version" ]; then
              npm view "@hellohelen-ai/expo-template-goliath@$version" dist.attestations
              exit 0
            fi
            sleep 10
          done
          echo "The registry did not serve template $version within twenty minutes." >&2
          exit 1
