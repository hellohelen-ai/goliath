name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Build the checkout before installing the linked example dependency.
  # The example exercises the API changed in this PR.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: bun run typecheck
        working-directory: example
      - run: bun run test
        working-directory: example
      # Typechecking does not catch an invalid app config or a missing native
      # peer dependency; doctor does, and bundling proves every import resolves.
      - run: bun run doctor
        working-directory: example
      - run: bun run bundle
        working-directory: example

  # Compile the real Expo bridge/provider, not only Metro's JavaScript bundle.
  native:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun run native:check
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: bunx --no-install expo prebuild --platform ios --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - name: Build the iOS simulator app without signing
        working-directory: example
        run: >-
          xcodebuild -workspace ios/GoliathExample.xcworkspace
          -scheme GoliathExample -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/goliath-native"
          CODE_SIGNING_ALLOWED=NO build

  # Scaffold outside the checkout so a parent import cannot hide a broken npm package.
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run starter:check "$RUNNER_TEMP/starter-artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter-artifacts
          path: ${{ runner.temp }}/starter-artifacts/*.tgz
          if-no-files-found: error

  # The docs site is a separate app. Build it on every PR so a broken page or a
  # dead sidebar slug cannot reach main; docs.yml deploys it from main.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website

  # Reanimated's rule: a change to the library is a change someone downstream reads about.
  # Add `no changelog` to the PR if it genuinely does not need an entry.
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an Unreleased entry when src/ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed" | sed 's/^/  /'

          if ! echo "$changed" | grep -q '^src/'; then
            echo "No src/ changes — changelog not required."
            exit 0
          fi

          if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This PR changes src/ but does not touch CHANGELOG.md. Add an entry under '## [Unreleased]', or label the PR 'no changelog'."
            exit 1
          fi

          # The entry has to be in the Unreleased section, not tacked onto a shipped version.
          added="$(git diff -U0 "$BASE_SHA"...HEAD -- CHANGELOG.md | grep '^+' | grep -v '^+++' || true)"
          unreleased="$(awk '/^## \[Unreleased\]/{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md)"
          found=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            entry="${line#+}"
            case "$entry" in \#*|"") continue;; esac
            if printf '%s\n' "$unreleased" | grep -Fqx -- "$entry"; then found=1; break; fi
          done <<< "$added"

          if [ "$found" -eq 0 ]; then
            echo "::error::CHANGELOG.md changed, but no new line landed under '## [Unreleased]'."
            exit 1
          fi
          echo "Unreleased entry present."
